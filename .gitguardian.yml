# ============================================================================
# GitGuardian configuration
# ----------------------------------------------------------------------------
# The Supabase `anon` key is a PUBLIC token by design -- it ships in every
# visitor's browser bundle. It's not a secret; the security boundary is the
# Row-Level Security policies in supabase/migrations/0001_initial_schema.sql.
# See: https://supabase.com/docs/guides/api/api-keys
#
# This config tells GitGuardian not to flag that key as a leaked credential.
# The `service_role` key (which IS secret) is never in this repo and must
# stay server-side only.
# ============================================================================

version: 2

secret:
  ignored-paths:
    - src/supabaseClient.js
  ignored-matches:
    - name: Supabase anon/public key (RLS-gated, not a secret)
      match: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIs
